<title>Édition au toucher</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --bg: #FFFFFF;
  --surface: #F4F5F7;
  --track: #ECEEF1;
  --line: #E5E7EB;
  --ink: #111827;
  --ink-2: #374151;
  --ink-3: #4B5563;
  --muted: #6B7280;
  --focus: #2563EB;
  --ok: #16A34A; --ok-ink: #166534;
  --warn: #EA580C; --warn-ink: #9A3412;
  --ko: #DC2626; --ko-ink: #991B1B;
  --none-ink: #475569;
  --off: #CBD5E1;
  --star: #B45309;
  --brand: #C81E1E; --brand-dark: #A51818;
  --in-bg: #F0FDF4; --in-line: #BBF7D0;
  --in-soft-bg: #F8FDF9; --in-soft-line: #DCFCE7;
  --out-bg: #E9EBEE; --out-line: #D5D9DF;
  --none-bg: #FFFFFF; --none-line: #E2E5EA;
  --r-card: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--surface); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.4;
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--surface); padding-bottom: calc(90px + env(safe-area-inset-bottom)); }

/* ---------- Reglages de la maquette (outil de revue) ---------- */
.review { position: absolute; z-index: 70; top: calc(env(safe-area-inset-top, 0px) + 8px); left: max(12px, calc(50% - 228px)); color: #F9FAFB; font-size: 13px; }
.review-toggle {
  min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: #1F2937; color: #F9FAFB; gap: 6px;
  box-shadow: 0 4px 14px rgba(0,0,0,.18); display: flex; align-items: center; cursor: pointer;
  font-size: 12.5px; font-weight: 600; position: relative;
}
.review-toggle::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; transform: translateY(-50%); }
.review-toggle .chev { transition: transform .2s; }
.review-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.review-body {
  margin-top: 6px; width: min(340px, calc(100vw - 24px)); padding: 12px 14px 14px; display: grid; gap: 10px;
  background: #1F2937; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.review fieldset { border: 0; margin: 0; padding: 0; }
.review legend { color: #D1D5DB; font-size: 12px; margin-bottom: 4px; }
.review .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.review label {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px;
  border: 1px solid #4B5563; border-radius: 999px; cursor: pointer; color: #F9FAFB;
}
.review label:has(input:checked) { background: #F9FAFB; color: #111827; border-color: #F9FAFB; }
.review input { accent-color: #111827; margin: 0; }
.review .reset-label { justify-content: center; border-style: dashed; }
.review .reset-label button { border: 0; background: transparent; color: inherit; padding: 0; cursor: pointer; font-size: 13px; min-height: 38px; }

/* ---------- Zone en-tete (blanche) ---------- */
.zone-head { background: var(--bg); }
.topbar { display: flex; justify-content: flex-end; padding: 8px 8px 0; min-height: 52px; }
.icon-btn {
  width: 44px; height: 44px; border: 0; background: transparent; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
}
.icon-btn:hover { background: var(--surface); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="true"] { color: #BE123C; }
.icon-btn[aria-pressed="true"] .heart { fill: currentColor; }
.head { padding: 4px 16px 12px; }
.title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.title { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; }
.tag-demo { font-size: 12px; font-weight: 600; color: var(--ink-2); border: 1px solid #9CA3AF; border-radius: 999px; padding: 0 8px; }

.status-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; min-height: 36px; font-size: 14.5px; color: var(--muted); }
.status-word { font-weight: 700; }
.status-row[data-state="working"] .status-word { color: var(--ok-ink); }
.status-row[data-state="empty"] .status-word { color: var(--warn-ink); }
.status-row[data-state="broken"] .status-word { color: var(--ko-ink); }
.status-row[data-state="none"] .status-word { color: var(--none-ink); }
.status-row.is-soft .status-word { color: var(--ink-3); }
.feu { display: inline-flex; gap: 4px; padding: 4px 6px; border-radius: 999px; background: #F1F5F9; border: 1px solid #E2E8F0; flex: none; }
.feu i { width: 9px; height: 9px; border-radius: 50%; background: var(--off); display: block; }
.status-row[data-state="working"] .feu i:nth-child(1), .feu.is-all i:nth-child(1) { background: var(--ok); }
.status-row[data-state="empty"] .feu i:nth-child(2), .feu.is-all i:nth-child(2) { background: var(--warn); }
.status-row[data-state="broken"] .feu i:nth-child(3), .feu.is-all i:nth-child(3) { background: var(--ko); }
.status-row.is-soft .feu i { opacity: .5; }
.update-pill {
  position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; margin-left: 2px;
  padding: 0 12px 0 10px; border: 1px solid #D1D5DB; border-radius: 999px; background: var(--bg); color: var(--ink);
  font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(17,24,39,.06);
}
.update-pill svg { width: 15px; height: 15px; }
.update-pill::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; transform: translateY(-50%); }
.update-pill[aria-expanded="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }

.meta { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; display: flex; align-items: center; flex-wrap: wrap; column-gap: 6px; min-height: 36px; }
.meta .sep { color: #9CA3AF; }
.meta .star { color: var(--star); }
.price-btn {
  position: relative; display: inline-flex; align-items: center; gap: 3px; min-height: 30px; padding: 0 6px 0 8px;
  border: 1px dashed #9CA3AF; border-radius: 8px; background: transparent; color: var(--ink); font-weight: 700; cursor: pointer;
}
.price-btn svg { width: 12px; height: 12px; color: var(--ink-3); }
.price-btn::after { content: ""; position: absolute; left: -4px; right: -4px; top: 50%; height: 44px; transform: translateY(-50%); }
.price-btn[aria-expanded="true"] { border-style: solid; border-color: var(--ink); background: var(--ink); color: #FFFFFF; }
.price-btn[aria-expanded="true"] svg { color: #FFFFFF; }

/* Choix en place (etat du distributeur, prix) : selecteur segmente gris */
.inline-panel { margin-top: 8px; padding: 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); animation: unfold .18s ease-out; }
.panel-q { margin: 0 0 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; border-radius: 12px; background: var(--track); }
.seg button {
  min-height: 46px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); cursor: pointer;
  font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 4px;
}
.seg button:hover { background: rgba(255,255,255,.6); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); font-weight: 800; box-shadow: 0 1px 3px rgba(17,24,39,.16); }
.seg button i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.seg .price-opt { font-size: 16px; letter-spacing: .02em; }
@keyframes unfold { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* ---------- Onglets ---------- */
.tabs { background: var(--bg); padding: 10px 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tabs-track { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--track); }
.tab { flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-3); font-weight: 600; font-size: 15px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--bg); color: var(--ink); font-weight: 800; box-shadow: 0 1px 3px rgba(17,24,39,.14); }

/* ---------- Contenu (gris clair) ---------- */
.content { padding: 4px 16px 16px; }
.shelf-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; margin: 16px 0 12px; }
.shelf-head h2 { margin: 0; font-size: 19px; font-weight: 800; }
.count { font-size: 15px; font-weight: 700; color: var(--ink-3); }
.notice { margin: 0 0 12px; padding: 2px 0 2px 10px; border-left: 2px solid var(--warn); color: var(--ink-2); font-size: 13.5px; line-height: 1.35; }
.notice b { color: var(--warn-ink); }
.notice.is-broken { border-left-color: var(--ko); }
.notice.is-broken b { color: var(--ko-ink); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }

/* Cartes teintees (maquette B) */
.card {
  position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px; min-width: 0;
  border-radius: var(--r-card); border: 1px solid var(--none-line); background: var(--none-bg);
  box-shadow: 0 1px 2px rgba(17,24,39,.06);
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation;
  transition: box-shadow .15s, border-color .15s;
}
.card.is-in { background: var(--in-bg); border-color: var(--in-line); }
.card.is-in.is-soft { background: var(--in-soft-bg); border-color: var(--in-soft-line); }
.card.is-out { background: var(--out-bg); border-color: var(--out-line); box-shadow: none; }
.card.is-open { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), 0 6px 16px rgba(17,24,39,.12); z-index: 2; }
.card.is-pressing { transform: scale(.985); transition: transform .4s ease-out; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.art {
  width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center;
  background: #FFFFFF; border: 1px solid rgba(17,24,39,.08); color: var(--ink-2);
}
.art svg { width: 22px; height: 22px; }
.body { display: grid; gap: 2px; min-width: 0; align-content: start; }
.name { font-size: 15.5px; font-weight: 700; line-height: 1.2; color: var(--ink); overflow-wrap: anywhere; }
.name-btn {
  position: relative; display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 0; margin: 0;
  cursor: text; border-radius: 4px;
}
.name-btn::after { content: ""; position: absolute; left: -4px; right: -4px; top: -8px; bottom: -6px; }
.fresh { font-size: 12.5px; color: var(--ink-3); }

/* L'etiquette EST le controle */
.pill {
  position: relative; display: inline-flex; align-items: center; gap: 5px; flex: none; min-height: 28px;
  font-size: 12.5px; font-weight: 700; padding: 0 7px; border-radius: 999px; border: 1px solid transparent;
  white-space: nowrap; cursor: pointer;
}
.pill::after { content: ""; position: absolute; left: -6px; right: -6px; top: 50%; height: 44px; transform: translateY(-50%); }
.pill i { width: 7px; height: 7px; border-radius: 50%; display: block; flex: none; }
.pill svg { width: 10px; height: 10px; flex: none; margin-left: -1px; transition: transform .15s; }
.pill[aria-expanded="true"] svg { transform: rotate(180deg); }
.pill.ok { background: var(--ok-ink); color: #FFFFFF; }
.pill.ok i { background: #FFFFFF; }
.pill.ok.soft { background: #DCFCE7; color: var(--ok-ink); border-color: #BBF7D0; }
.pill.ok.soft i { background: var(--ok); }
.pill.out { background: var(--ink-3); color: #FFFFFF; }
.pill.out i { background: #FFFFFF; }
.pill.none { background: #FFFFFF; color: var(--none-ink); border-color: #CBD5E1; }
.pill.none i { background: transparent; border: 1px solid #94A3B8; }
.pill:focus-visible { outline-offset: 3px; border-radius: 999px; }
.card.has-hint .pill { animation: ring 1.6s ease-out .6s 3; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(17,24,39,.35); } 80%, 100% { box-shadow: 0 0 0 8px rgba(17,24,39,0); } }

/* Indice de premier usage : dans la carte, pointe vers l'etiquette */
.hint-first {
  position: relative; margin: 2px 0 0; padding: 6px 9px; border-radius: 9px; background: var(--ink); color: #FFFFFF;
  font-size: 12.5px; font-weight: 600; line-height: 1.3;
}
.hint-first::before {
  content: ""; position: absolute; top: -6px; right: 26px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--ink);
}

/* « Toujours la ? » : l'etiquette se deplie en interrupteur a deux positions, colle au bas de la carte */
.ask-wrap { margin: 2px -12px -12px; animation: unfold .18s ease-out; }
.ask-q { margin: 0 12px 8px; font-size: 13px; font-weight: 700; color: var(--ink); }
.ask {
  display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(17,24,39,.14);
  border-radius: 0 0 13px 13px; overflow: hidden;
}
.ask button {
  min-height: 54px; border: 0; background: rgba(255,255,255,.85); cursor: pointer; padding: 4px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 14px; font-weight: 800; transition: background .12s, color .12s;
}
.ask button + button { border-left: 1px solid rgba(17,24,39,.14); }
.ask button i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.ask .yes { color: var(--ok-ink); }
.ask .yes i { background: var(--ok); }
.ask .no { color: var(--ink-2); }
.ask .no i { background: #9CA3AF; }
.ask .yes:hover { background: #FFFFFF; }
.ask .no:hover { background: #FFFFFF; }
.ask .yes[aria-pressed="true"] { background: var(--ok-ink); color: #FFFFFF; }
.ask .no[aria-pressed="true"] { background: var(--ink-3); color: #FFFFFF; }
.ask [aria-pressed="true"] i { background: #FFFFFF; }
.ask button:focus-visible { outline-offset: -4px; }
.ask .now { font-size: 11px; font-weight: 600; opacity: .9; }

/* Renommer en place */
.name-edit { display: grid; gap: 3px; }
.name-input {
  width: 100%; min-width: 0; font: inherit; font-size: 16px; font-weight: 700; color: var(--ink);
  border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; background: transparent; padding: 3px 0; margin: 0;
  -webkit-user-select: text; user-select: text;
}
.name-input:focus { outline: none; border-bottom-color: var(--focus); }
.name-input::placeholder { color: var(--muted); font-weight: 600; }
.name-help { font-size: 12px; color: var(--ink-3); }
.name-help.is-empty { color: var(--ko-ink); font-weight: 600; }

/* Menu contextuel leger (appui long / clic droit / Maj+F10) */
.menu {
  position: absolute; top: 8px; left: 8px; right: 8px; z-index: 5; padding: 4px;
  background: #FFFFFF; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(17,24,39,.22);
  animation: pop .14s ease-out;
}
.menu button {
  width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 8px;
  background: transparent; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left;
}
.menu button svg { width: 18px; height: 18px; flex: none; }
.menu button:hover, .menu button:focus { background: var(--surface); }
.menu .danger { color: var(--ko-ink); }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

.card.is-flash { animation: flash .9s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px rgba(17,24,39,.55); } 100% { box-shadow: 0 0 0 3px rgba(17,24,39,0); } }

/* Carte fantome : ajouter */
.ghost {
  position: relative; min-width: 0; border-radius: var(--r-card); border: 1.5px dashed #9CA3AF; background: rgba(255,255,255,.5);
  display: flex; flex-direction: column;
}
.ghost-btn {
  flex: 1; min-height: 120px; width: 100%; border: 0; background: transparent; border-radius: 13px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px 10px; text-align: center; color: var(--ink-2);
}
.ghost-btn:hover { background: rgba(255,255,255,.9); }
.ghost-plus { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #FFFFFF; border: 1.5px solid #9CA3AF; color: var(--ink); }
.ghost-plus svg { width: 20px; height: 20px; }
.ghost-title { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.25; }
.ghost-sub { font-size: 13px; color: var(--ink-3); line-height: 1.3; max-width: 260px; }
.ghost.is-first { grid-column: 1 / -1; }
.ghost.is-first .ghost-btn { min-height: 168px; }
.ghost.is-first .ghost-plus { width: 48px; height: 48px; }
.ghost.is-first .ghost-plus svg { width: 26px; height: 26px; }
.ghost.is-first .ghost-title { font-size: 17px; }
.ghost.is-edit { border-style: solid; border-color: var(--ink); background: #FFFFFF; box-shadow: 0 0 0 1px var(--ink); }
.ghost-edit { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.ghost-tag { font-size: 12px; font-weight: 700; color: var(--none-ink); border: 1px solid #CBD5E1; border-radius: 999px; padding: 3px 8px; white-space: nowrap; }

/* Pas de produit, visiteur */
.empty-note { grid-column: 1 / -1; margin: 0; padding: 18px 16px; border: 1.5px dashed #CBD5E1; border-radius: var(--r-card); background: #FFFFFF; text-align: center; color: var(--ink-3); font-size: 14px; }
.empty-note strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 2px; }

/* Invitation visiteur */
.invite {
  margin-top: 14px; padding: 12px 14px; border-radius: 16px;
  background: linear-gradient(180deg, #FFF7F7 0%, #FFFFFF 100%); border: 1px solid #F5D0D0;
  display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; row-gap: 10px; align-items: start;
}
.invite.is-called { animation: called 1.2s ease-out; }
@keyframes called { 0%, 40% { box-shadow: 0 0 0 4px rgba(200,30,30,.45); } 100% { box-shadow: 0 0 0 4px rgba(200,30,30,0); } }
.invite-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brand); color: #FFFFFF; }
.invite-ico svg { width: 22px; height: 22px; }
.invite-text h3 { margin: 0 0 2px; font-size: 16px; font-weight: 800; line-height: 1.25; }
.invite-text p { margin: 0; font-size: 14px; line-height: 1.35; color: var(--ink-2); }
.invite-preview { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.invite-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; background: #FFFFFF; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.invite-chip .feu { padding: 2px 4px; }
.invite-chip .feu i { width: 7px; height: 7px; }
.btn-brand { grid-column: 1 / -1; min-height: 46px; border-radius: 12px; border: 0; background: var(--brand); color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 6px rgba(200,30,30,.3); }
.btn-brand:hover { background: var(--brand-dark); }

/* Avis / A propos */
.panel-card { margin-top: 16px; padding: 14px; border-radius: var(--r-card); background: #FFFFFF; border: 1px solid var(--line); }
.panel-card h2 { margin: 0 0 10px; font-size: 17px; }
.rating { display: flex; align-items: center; gap: 12px; }
.rating .big { font-size: 28px; font-weight: 800; }
.stars { color: var(--star); letter-spacing: 1px; }
.review-item { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.review-item b { color: var(--ink); }
.about-row { display: flex; gap: 12px; align-items: flex-start; color: var(--ink-2); font-size: 14px; padding: 6px 0; }
.about-row svg { width: 20px; height: 20px; flex: none; color: var(--muted); margin-top: 1px; }

/* Pied colle en bas : Photo (connecte) + Itineraire */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #FFFFFF; border-top: 1px solid var(--line);
  box-shadow: 0 -6px 16px rgba(17,24,39,.07); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
}
.dock-in { max-width: 448px; margin: 0 auto; display: flex; gap: 8px; }
.btn {
  min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #9CA3AF; background: #FFFFFF; color: var(--ink);
  font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
}
.btn svg { width: 20px; height: 20px; }
.btn-dark { flex: 1; background: var(--ink); border-color: var(--ink); color: #FFFFFF; font-size: 16px; box-shadow: 0 2px 6px rgba(17,24,39,.25); }

/* Toast (Annuler = retour, pas un bouton d'edition) */
.toast {
  position: fixed; left: 50%; bottom: calc(82px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60;
  width: max-content; max-width: min(448px, calc(100vw - 32px)); display: flex; align-items: center; gap: 4px;
  background: var(--ink); color: #FFFFFF; padding: 4px 6px 4px 16px; min-height: 48px; border-radius: 12px; font-size: 14.5px;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: toastin .18s ease-out;
}
.toast-msg { padding: 8px 0; flex: 1 1 auto; min-width: 0; }
.toast.no-undo { padding-right: 16px; }
.toast-undo {
  flex: none; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #93C5FD;
  font-weight: 800; font-size: 14.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.toast-undo:focus-visible { outline-color: #93C5FD; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
(function () {
  'use strict';

  var SOFT_AFTER = 120;      // minutes : au-dela, la couleur s'adoucit
  var LONG_PRESS_MS = 500;
  var MOVE_TOLERANCE = 10;   // px : au-dela, c'est un defilement, pas une action
  var DIST_WORD = { working: 'En service', empty: 'Vide', broken: 'En panne', none: "Pas d'info" };
  var DIST_COLOR = { working: 'var(--ok)', empty: 'var(--warn)', broken: 'var(--ko)' };
  var PRICES = ['€', '€€', '€€€'];
  var ORDER = { in: 0, none: 1, out: 2 };

  var S = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  var ART = {
    basket: '<svg viewBox="0 0 24 24" ' + S + '><path d="M4 10h16l-1.6 8.4A2 2 0 0 1 16.4 20H7.6a2 2 0 0 1-2-1.6z"/><path d="M8.5 10 12 4.5 15.5 10M9.5 14v2.5M14.5 14v2.5"/></svg>',
    potato: '<svg viewBox="0 0 24 24" ' + S + '><path d="M7.5 5.5c3.2-2.1 8.8-1.2 10.7 2.6 1.9 3.9.6 8.8-3.4 10.4-4.1 1.7-9.7.7-10.9-3.8C3 11.4 4.6 7.4 7.5 5.5z"/><path d="M9.5 10h.01M14 13.5h.01M11.5 15.5h.01"/></svg>',
    carrot: '<svg viewBox="0 0 24 24" ' + S + '><path d="M15.5 8.5c1.4 1.4 1.3 3-.1 4.4L6.2 20.1c-.9.6-2-.4-1.4-1.3L12 9.6c1.4-1.4 2.9-1.5 3.5-1.1z"/><path d="M15.5 8.5 19 5M15.5 8.5 16 3.5M15.5 8.5l5 .5M9 13.5l1.5 1.5M11.5 11l1 1"/></svg>',
    salad: '<svg viewBox="0 0 24 24" ' + S + '><path d="M12 20c-4.8 0-8-2.8-8-6.6 0-1.8.9-3 2-3.8.2-3 2.8-5.1 6-5.1s5.8 2.1 6 5.1c1.1.8 2 2 2 3.8 0 3.8-3.2 6.6-8 6.6z"/><path d="M12 20v-9M12 15l-3-3M12 17l3-3"/></svg>',
    bread: '<svg viewBox="0 0 24 24" ' + S + '><path d="M6 11.5A3.5 3.5 0 0 1 7 5h10a3.5 3.5 0 0 1 1 6.5V18a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M10 9.5v2M14 9.5v2"/></svg>',
    egg: '<svg viewBox="0 0 24 24" ' + S + '><path d="M12 3c3.5 0 6.5 5.5 6.5 10a6.5 6.5 0 0 1-13 0C5.5 8.5 8.5 3 12 3z"/></svg>',
    milk: '<svg viewBox="0 0 24 24" ' + S + '><path d="M9 3h6M9.5 3v3L7 10v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9l-2.5-4V3"/><path d="M7 13h10"/></svg>',
    cheese: '<svg viewBox="0 0 24 24" ' + S + '><path d="M3 13 15 6l6 5v7H3z"/><path d="M3 13h18"/><circle cx="8" cy="16" r="1"/><circle cx="15" cy="15.5" r="1.2"/></svg>',
    apple: '<svg viewBox="0 0 24 24" ' + S + '><path d="M12 7.5c-1.5-1-5-1.2-6.3 1.8C4.4 12.4 6.5 20 9.5 20c1.2 0 1.6-.6 2.5-.6s1.3.6 2.5.6c3 0 5.1-7.6 3.8-10.7C17 6.3 13.5 6.5 12 7.5z"/><path d="M12 7.5c0-2 1-3.5 3-4.2"/></svg>',
    pizza: '<svg viewBox="0 0 24 24" ' + S + '><path d="M12 21 3.5 5.5c5.3-2.7 11.7-2.7 17 0z"/><path d="M5 8.2c4.4-2 9.6-2 14 0"/><circle cx="10" cy="11" r="1"/><circle cx="14" cy="13.5" r="1"/></svg>',
    jar: '<svg viewBox="0 0 24 24" ' + S + '><path d="M8 3h8v3H8z"/><path d="M7 6h10a1 1 0 0 1 1 1v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7a1 1 0 0 1 1-1z"/><path d="M6 11h12"/></svg>',
    meat: '<svg viewBox="0 0 24 24" ' + S + '><path d="M5 9c1-4 6-6 10-5s6 5 4 9-7 7-11 6-4-6-3-10z"/><circle cx="14" cy="10" r="2"/></svg>',
    drink: '<svg viewBox="0 0 24 24" ' + S + '><path d="M10 2h4v4l2 3v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9l2-3z"/><path d="M8 13h8"/></svg>',
    generic: '<svg viewBox="0 0 24 24" ' + S + '><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>'
  };
  // Picto choisi d'apres le nom (ordre important : « pomme de terre » avant « pomme », « fromage » avant « lait »)
  var ART_RULES = [
    [/pommes? de terre|patate/, 'potato'],
    [/carott/, 'carrot'],
    [/salade|laitue|mesclun|roquette/, 'salad'],
    [/\bpains?\b|baguette|brioche|viennois|croissant|miche/, 'bread'],
    [/fromage|tomme|brebis|chevre|comte|ossau|camembert/, 'cheese'],
    [/\boeufs?\b/, 'egg'],
    [/\blait\b|yaourt|creme|beurre|laitier/, 'milk'],
    [/pizza/, 'pizza'],
    [/pommes?|poires?|fruit|fraises?|kiwis?|cerises?|peche/, 'apple'],
    [/legume|panier|soupe|courge|tomate|poireau/, 'basket'],
    [/miel|confiture|conserve|terrine|bocal|pate/, 'jar'],
    [/viande|saucisse|jambon|boeuf|porc|poulet|agneau|chorizo|merguez|steak/, 'meat'],
    [/\b(jus|cidre|eaux?|boissons?|bieres?|vins?|sirops?)\b/, 'drink']
  ];
  function pickArt(name) {
    var n = String(name).toLowerCase().replace(/œ/g, 'oe').normalize('NFD').replace(/[̀-ͯ]/g, '');
    for (var i = 0; i < ART_RULES.length; i++) if (ART_RULES[i][0].test(n)) return ART_RULES[i][1];
    return 'generic';
  }

  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  var ICON_PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
  var ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>';
  var ICON_REFRESH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 4v3h3M4 13a8 8 0 0 0 14.6 4.5M20 20v-3h-3"/></svg>';

  function initialFiches() {
    return {
      products: {
        name: 'Légumes Bio Cambo', demo: true, type: 'Produits agricoles', price: '€€', rating: '4,7', reviews: 91,
        address: 'Route des Thermes, 64250 Cambo-les-Bains', distance: '2,3 km',
        dist: { state: 'working', age: 12 },
        products: [
          { id: 'p1', name: 'Panier légumes saison', art: 'basket', sig: { status: 'in', age: 12 } },
          { id: 'p2', name: 'Pommes de terre (2 kg)', art: 'potato', sig: { status: 'in', age: 180 } },
          { id: 'p3', name: 'Carottes (1 kg)', art: 'carrot', sig: { status: 'out', age: 40 } },
          { id: 'p4', name: 'Salades (lot de 2)', art: 'salad', sig: null }
        ]
      },
      empty: {
        name: 'Gaztainbidea', demo: false, type: 'Terroir local', price: '€', rating: null, reviews: 0,
        address: 'Impasse Gaztainbidea, 64250 Cambo-les-Bains', distance: '450 m',
        dist: { state: 'broken', age: 120 },
        products: []
      }
    };
  }

  var state = {
    mode: 'member', ficheKey: 'products', fiches: initialFiches(), tab: 'products',
    openId: null, editId: null, menuId: null, panel: null, hintDone: false, fav: false, seq: 0
  };

  function $(id) { return document.getElementById(id); }
  function F() { return state.fiches[state.ficheKey]; }
  function isMember() { return state.mode === 'member'; }
  function reduced() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  // Espace insecable entre un nombre et son unite : « (2 kg) » ne se coupe pas
  function unbreak(s) { return String(s).replace(/(\d) (kg|g|l|cl|ml|pièces?)(?![a-z])/gi, '$1 $2'); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) { /* pas de vibreur */ } }
  function findProduct(id) { return F().products.filter(function (p) { return p.id === id; })[0]; }
  function cardEl(id) { return $('grid').querySelector('.card[data-id="' + id + '"]'); }

  function formatAge(min) {
    if (min < 1) return "à l'instant";
    if (min < 60) return 'il y a ' + min + ' min';
    if (min < 1440) return 'il y a ' + Math.floor(min / 60) + ' h';
    return 'il y a ' + Math.floor(min / 1440) + ' j';
  }

  // Un distributeur vide / en panne plus recent que le signal d'un produit le passe en Pas dispo
  function resolve(p) {
    var d = F().dist;
    var s = p.sig;
    if (s && (d.state === 'empty' || d.state === 'broken') && s.age > d.age) return { status: 'out', age: d.age };
    if (!s || s.age >= 1440) return { status: 'none', age: null };
    return { status: s.status, age: s.age };
  }
  function word(status) { return status === 'in' ? 'Dispo' : status === 'out' ? 'Pas dispo' : "Pas d'info"; }

  // ---------- En-tete ----------
  function renderHead() {
    var f = F();
    $('name').textContent = f.name;
    $('demo').hidden = !f.demo;
    var d = f.dist;
    var row = $('status-row');
    var soft = d.state !== 'none' && d.age >= SOFT_AFTER;
    row.dataset.state = d.state;
    row.classList.toggle('is-soft', soft);
    var html = '<span class="feu" aria-hidden="true"><i></i><i></i><i></i></span><span class="status-word">' + DIST_WORD[d.state] + '</span><span>· ' + esc(formatAge(d.age)) + '</span>';
    if (isMember()) {
      html += '<button type="button" class="update-pill" data-act="dist-toggle" aria-expanded="' + (state.panel === 'dist') + '" aria-controls="dist-panel">' + ICON_REFRESH + 'Mettre à jour</button>';
    }
    row.innerHTML = html;

    var price = isMember()
      ? '<button type="button" class="price-btn" data-act="price-toggle" aria-expanded="' + (state.panel === 'price') + '" aria-controls="price-panel" aria-label="Niveau de prix : ' + f.price + '. Changer">' + f.price + CHEV + '</button>'
      : '<span>' + f.price + '</span>';
    var rating = f.rating
      ? '<span><span class="star" aria-hidden="true">★</span> ' + f.rating + ' (' + f.reviews + ')</span>'
      : '<span>Pas encore d\'avis</span>';
    $('meta').innerHTML = '<span>' + esc(f.type) + '</span><span class="sep" aria-hidden="true">·</span>' + price + '<span class="sep" aria-hidden="true">·</span>' + rating;
    renderPanels();
  }

  function renderPanels() {
    var dp = $('dist-panel'), pp = $('price-panel');
    dp.hidden = state.panel !== 'dist';
    pp.hidden = state.panel !== 'price';
    if (state.panel === 'dist') {
      var cur = F().dist.state;
      dp.innerHTML = '<p class="panel-q" id="dist-q">Le distributeur, là maintenant ?</p><div class="seg" role="group" aria-labelledby="dist-q">'
        + ['working', 'empty', 'broken'].map(function (s) {
          return '<button type="button" data-act="dist" data-v="' + s + '" aria-pressed="' + (cur === s) + '"><i style="background:' + DIST_COLOR[s] + '"></i>' + DIST_WORD[s] + '</button>';
        }).join('') + '</div>';
    }
    if (state.panel === 'price') {
      var p = F().price;
      pp.innerHTML = '<p class="panel-q" id="price-q">Niveau de prix</p><div class="seg" role="group" aria-labelledby="price-q">'
        + PRICES.map(function (v) {
          return '<button type="button" class="price-opt" data-act="price" data-v="' + v + '" aria-pressed="' + (p === v) + '">' + v + '</button>';
        }).join('') + '</div>';
    }
  }

  function togglePanel(name) {
    closeAsk(false); closeMenu(false);
    state.panel = state.panel === name ? null : name;
    renderHead();
    var focusSel = state.panel ? '#' + name + '-panel [aria-pressed="true"], #' + name + '-panel button' : '[data-act="' + name + '-toggle"]';
    var el = document.querySelector(focusSel);
    if (el) el.focus();
  }
  function closePanel(restoreFocus) {
    if (!state.panel) return;
    var name = state.panel;
    state.panel = null;
    renderHead();
    if (restoreFocus) { var t = document.querySelector('[data-act="' + name + '-toggle"]'); if (t) t.focus(); }
  }

  // ---------- Vitrine ----------
  function cardHTML(p, r, isFirst) {
    var member = isMember();
    var soft = r.status === 'in' && r.age !== null && r.age >= SOFT_AFTER;
    var cls = 'card ' + (r.status === 'in' ? 'is-in' : r.status === 'out' ? 'is-out' : 'is-none') + (soft ? ' is-soft' : '');
    var showHint = member && isFirst && !state.hintDone;
    if (showHint) cls += ' has-hint';

  $('fav').addEventListener('click', function () {
    state.fav = !state.fav;
    this.setAttribute('aria-pressed', String(state.fav));
    this.setAttribute('aria-label', state.fav ? 'Retirer des favoris' : 'Ajouter aux favoris');
    toast(state.fav ? 'Ajouté à tes favoris' : 'Retiré de tes favoris');
  });
  $('share').addEventListener('click', function () { toast('Lien copié'); });
  $('close').addEventListener('click', function () { toast('Maquette : retour à la carte'); });
  $('route').addEventListener('click', function () { toast('Maquette : ouverture de l\'itinéraire'); });
  $('photo').addEventListener('click', function () { toast('Maquette : ajouter une photo'); });

  render();
})();
</script>
