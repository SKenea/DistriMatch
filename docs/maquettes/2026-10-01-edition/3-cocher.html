<title>Édition en liste</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --bg: #FFFFFF;
  --surface: #F4F5F7;
  --track: #ECEEF1;
  --line: #E5E7EB;
  --ink: #111827;
  --ink-2: #374151;
  --muted: #4B5563;
  --focus: #2563EB;
  --ok: #16A34A; --ok-ink: #166534;
  --warn: #EA580C; --warn-ink: #9A3412;
  --ko: #DC2626; --ko-ink: #991B1B; --danger: #B91C1C;
  --none-ink: #475569;
  --off: #CBD5E1;
  --star: #B45309;
  --brand: #C81E1E; --brand-dark: #A51818;
  /* Teintes des lignes (reprises de la fiche v3) */
  --in-bg: #F0FDF4; --in-line: #BBF7D0;
  --soft-bg: #F8FDF9; --soft-line: #DCFCE7;
  --out-bg: #E9EBEE; --out-line: #D5D9DF;
  --none-bg: #FFFFFF; --none-line: #E2E5EA;
  --r-card: 14px;
  --del-w: 104px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--surface); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.4; overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--surface); padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

/* ---------- Reglages de la maquette (outil de revue) ---------- */
.review { position: fixed; z-index: 70; top: calc(env(safe-area-inset-top, 0px) + 6px); left: max(8px, calc(50% - 232px)); font-size: 13px; color: #F9FAFB; }
.review-toggle {
  min-height: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: #1F2937; color: #F9FAFB;
  display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12.5px; font-weight: 600;
  box-shadow: 0 4px 14px rgba(0,0,0,.18);
}
.review-toggle .chev { transition: transform .2s; }
.review-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.review-body {
  margin-top: 6px; width: min(340px, calc(100vw - 32px)); padding: 12px 14px 14px; display: grid; gap: 10px;
  background: #1F2937; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.review fieldset { border: 0; margin: 0; padding: 0; }
.review legend { color: #D1D5DB; font-size: 12px; margin-bottom: 4px; }
.review .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.review label {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px;
  border: 1px solid #4B5563; border-radius: 999px; cursor: pointer; color: #F9FAFB;
}
.review label:has(input:checked) { background: #F9FAFB; color: #111827; border-color: #F9FAFB; }
.review input { accent-color: #111827; margin: 0; }
.review-reset {
  min-height: 44px; border: 1px solid #6B7280; border-radius: 10px; background: transparent; color: #F9FAFB;
  font-weight: 600; cursor: pointer;
}

/* ---------- En-tete (zone blanche) ---------- */
.top { background: var(--bg); }
.topbar { display: flex; justify-content: flex-end; padding: 6px 8px 0; min-height: 50px; }
.icon-btn {
  width: 44px; height: 44px; border: 0; background: transparent; border-radius: 999px; cursor: pointer; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--surface); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="true"] { color: #BE123C; }
.icon-btn[aria-pressed="true"] .heart { fill: currentColor; }
.head { padding: 4px 16px 12px; }
.title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.tag-demo { font-size: 13px; color: #6B5B4B; border: 1.5px solid #8B7B6B; border-radius: 999px; padding: 0 9px; line-height: 22px; }
.status-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; min-height: 36px; font-size: 15px; color: var(--muted); }
.status-word { font-weight: 700; }
.status-row[data-state="working"] .status-word { color: var(--ok-ink); }
.status-row[data-state="empty"] .status-word { color: var(--warn-ink); }
.status-row[data-state="broken"] .status-word { color: var(--ko-ink); }
.status-row[data-state="none"] .status-word { color: var(--none-ink); }
.feu { display: inline-flex; gap: 4px; padding: 4px 6px; border-radius: 999px; background: #F1F5F9; border: 1px solid #E2E8F0; flex: none; }
.feu i { width: 9px; height: 9px; border-radius: 50%; background: var(--off); display: block; }
.status-row[data-state="working"] .feu i:nth-child(1), .feu.all i:nth-child(1) { background: var(--ok); }
.status-row[data-state="empty"] .feu i:nth-child(2), .feu.all i:nth-child(2) { background: var(--warn); }
.status-row[data-state="broken"] .feu i:nth-child(3), .feu.all i:nth-child(3) { background: var(--ko); }
.update-pill {
  position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; margin-left: 4px;
  padding: 0 12px 0 10px; border: 1px solid #D1D5DB; border-radius: 999px; background: #FFFFFF; color: var(--ink);
  font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(17,24,39,.06);
}
.update-pill svg { width: 15px; height: 15px; }
.update-pill::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; transform: translateY(-50%); }
.update-pill:hover { background: #F3F4F6; }
.meta { margin: 2px 0 0; color: var(--muted); font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; min-height: 30px; }
.meta .star { color: var(--star); }
/* Le prix : la valeur est le controle */
.price-btn {
  position: relative; border: 0; background: transparent; padding: 0 2px; cursor: pointer; color: var(--ink); font-weight: 700;
  text-decoration: underline dotted #6B7280; text-decoration-thickness: 2px; text-underline-offset: 4px; min-height: 30px;
}
.price-btn::after { content: ""; position: absolute; left: -10px; right: -10px; top: 50%; height: 44px; transform: translateY(-50%); }
.price-pick { display: inline-flex; gap: 3px; padding: 3px; border-radius: 11px; background: var(--track); }
.price-pick button {
  min-width: 46px; min-height: 44px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
  font-weight: 700; color: var(--muted); font-size: 15px;
}
.price-pick button[aria-checked="true"] { background: #FFFFFF; color: var(--ink); box-shadow: 0 1px 3px rgba(17,24,39,.16); }

/* Onglets : piste grise, onglet actif blanc */
.tabs { background: var(--bg); padding: 10px 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tabs-track { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--track); }
.tab {
  flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; cursor: pointer;
  color: var(--muted); font-weight: 600; font-size: 15px;
}
.tab[aria-selected="true"] { background: #FFFFFF; color: var(--ink); font-weight: 800; box-shadow: 0 1px 3px rgba(17,24,39,.14); }

/* ---------- Contenu (fond gris) ---------- */
.content { padding: 4px 16px 16px; }
.shelf-head { display: flex; align-items: baseline; gap: 6px; margin: 14px 0 10px; flex-wrap: wrap; }
.shelf-head h2 { margin: 0; font-size: 19px; font-weight: 800; }
.count { font-size: 15px; color: #6B5B4B; font-weight: 700; }
.notice { margin: 0 0 12px; padding: 2px 0 2px 10px; border-left: 2px solid var(--warn); color: var(--ink-2); font-size: 13.5px; line-height: 1.35; }
.notice.broken { border-left-color: var(--ko); }
.notice b { font-weight: 700; }
.notice.broken b { color: var(--ko-ink); }

/* Liste de courses */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { position: relative; border-radius: var(--r-card); overflow: hidden; }
.item-del {
  position: absolute; top: 0; right: 0; bottom: 0; width: var(--del-w); border: 0; cursor: pointer;
  background: var(--danger); color: #FFFFFF; font-weight: 700; font-size: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border-radius: 0 var(--r-card) var(--r-card) 0;
}
.item-del svg { width: 20px; height: 20px; }
.item-del.full { width: 100%; }
.item-del { visibility: hidden; }
.item.show-del .item-del { visibility: visible; }
.row {
  position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; row-gap: 2px; min-height: 64px;
  padding: 8px 4px 8px 12px; border: 1px solid var(--none-line); border-radius: var(--r-card); background: var(--none-bg);
  box-shadow: 0 1px 2px rgba(17,24,39,.06); cursor: pointer;
  touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: transform .22s ease, background-color .2s;
}
.row.dragging { transition: none; }
.row.is-in { background: var(--in-bg); border-color: var(--in-line); }
.row.is-in.is-soft { background: var(--soft-bg); border-color: var(--soft-line); }
.row.is-out { background: var(--out-bg); border-color: var(--out-line); box-shadow: none; }
.row.visitor { cursor: default; }
.art {
  width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center;
  background: #FFFFFF; border: 1px solid rgba(17,24,39,.08); color: var(--ink-2);
}
.art svg { width: 22px; height: 22px; }
.row.is-out .art { color: #6B7280; }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
.name {
  border: 0; background: transparent; padding: 2px 0; margin: 0; text-align: left; cursor: text;
  font-size: 16px; font-weight: 700; line-height: 1.25; color: var(--ink); overflow-wrap: anywhere; max-width: 100%;
  min-height: 28px;
}
button.name:hover { text-decoration: underline dotted #9CA3AF; text-underline-offset: 3px; }
.row.is-out .name { color: var(--muted); text-decoration: line-through; text-decoration-color: #6B7280; text-decoration-thickness: 1.5px; }
.name-input {
  width: 100%; min-height: 36px; padding: 4px 8px; margin: -2px 0 0 -8px; width: calc(100% + 8px);
  border: 2px solid var(--focus); border-radius: 8px; background: #FFFFFF; font-size: 16px; font-weight: 700; color: var(--ink);
  -webkit-user-select: text; user-select: text;
}
.name-input:focus-visible { outline: none; }
.sub { font-size: 13.5px; color: var(--muted); }
.sub b { font-weight: 700; }
.row.is-in .sub b { color: var(--ok-ink); }
.row.is-out .sub b { color: var(--ink-2); }
.row.is-none .sub b { color: var(--none-ink); }
.hint {
  flex-basis: calc(100% - 60px); margin: 0 0 4px 48px; display: inline-flex; align-items: flex-start; gap: 5px; font-size: 13px; line-height: 1.3; color: var(--ink-2);
  background: #FFFFFF; border: 1px solid #D1D5DB; border-radius: 8px; padding: 4px 8px;
}
.hint svg { width: 14px; height: 14px; flex: none; margin-top: 1px; color: var(--focus); }

/* La case ronde, a droite : la valeur est le controle */
.check {
  width: 52px; height: 52px; flex: none; border: 0; background: transparent; padding: 0; cursor: pointer;
  display: grid; place-items: center; border-radius: 999px;
}
.ring {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: #FFFFFF; border: 2px dashed #64748B; transition: transform .15s, background-color .15s;
}
.ring svg { width: 18px; height: 18px; }
.row.is-in .ring { background: var(--ok-ink); border: 2px solid var(--ok-ink); color: #FFFFFF; }
.row.is-in.is-soft .ring { background: #DCFCE7; border-color: var(--ok-ink); color: var(--ok-ink); }
.row.is-out .ring { background: #FFFFFF; border: 2px solid #4B5563; color: #4B5563; }
.check:active .ring { transform: scale(.88); }
.row.visitor .check { cursor: default; }
.row.pop .ring { animation: pop .32s ease-out; }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.row.flash { animation: flash .9s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px rgba(37,99,235,.45); } 100% { box-shadow: 0 1px 2px rgba(17,24,39,.06); } }

/* Ligne d'ajout, toujours presente en bas (facon Keep) */
.add-row {
  margin-top: 8px; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px;
  border: 1.5px dashed #9CA3AF; border-radius: var(--r-card); background: rgba(255,255,255,.6); cursor: text;
}
.add-row:focus-within { border-style: solid; border-color: var(--focus); background: #FFFFFF; }
.add-ico { width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center; background: #FFFFFF; border: 1px solid #D1D5DB; color: var(--ink-2); }
.add-ico svg { width: 20px; height: 20px; }
.add-input { flex: 1; min-width: 0; min-height: 44px; border: 0; background: transparent; font-size: 16px; font-weight: 600; color: var(--ink); }
.add-input::placeholder { color: #4B5563; font-weight: 600; opacity: 1; }
.add-input:focus-visible { outline: none; }
.add-row.lone { background: #FFFFFF; border-color: #6B7280; min-height: 64px; }

.empty { border: 1.5px dashed #CBD5E1; border-radius: var(--r-card); padding: 20px 16px; text-align: center; color: var(--muted); background: #FFFFFF; }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.empty.member { border: 0; background: transparent; padding: 4px 4px 0; text-align: left; }

/* Invitation visiteur */
.invite {
  margin-top: 14px; padding: 12px 14px; border-radius: 16px;
  background: linear-gradient(180deg, #FFF7F7 0%, #FFFFFF 100%); border: 1px solid #F5D0D0;
  display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; row-gap: 10px; align-items: start;
}
.invite.nudge { animation: nudge .9s ease-out; }
@keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(200,30,30,.55); } 100% { box-shadow: 0 0 0 14px rgba(200,30,30,0); } }
.invite-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brand); color: #FFFFFF; }
.invite-ico svg { width: 22px; height: 22px; }
.invite-text h3 { margin: 0 0 2px; font-size: 16px; font-weight: 800; line-height: 1.25; }
.invite-text p { margin: 0; font-size: 14px; line-height: 1.35; color: var(--ink-2); }
.invite-preview { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.invite-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; background: #FFFFFF; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.invite-chip .feu { padding: 2px 4px; }
.invite-chip .feu i { width: 7px; height: 7px; }
.btn-brand { grid-column: 1 / -1; min-height: 46px; border: 0; border-radius: 12px; background: var(--brand); color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 6px rgba(200,30,30,.3); }
.btn-brand:hover { background: var(--brand-dark); }

/* Avis / A propos */
.panel-card { background: #FFFFFF; border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; margin-top: 14px; }
.rating { display: flex; align-items: center; gap: 12px; }
.rating .big { font-size: 28px; font-weight: 800; }
.stars { color: var(--star); letter-spacing: 1px; }
.review-item { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.about { display: grid; gap: 12px; font-size: 14.5px; }
.about-row { display: flex; gap: 12px; align-items: flex-start; color: var(--ink-2); }
.about-row svg { width: 20px; height: 20px; flex: none; color: var(--muted); margin-top: 1px; }

/* Pied colle en bas */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #FFFFFF; border-top: 1px solid var(--line);
  box-shadow: 0 -6px 16px rgba(17,24,39,.07); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
}
.dock-in { max-width: 448px; margin: 0 auto; display: flex; gap: 8px; }
.btn {
  min-height: 48px; padding: 0 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
}
.btn svg { width: 20px; height: 20px; }
.btn-dark { flex: 1; background: var(--ink); color: #FFFFFF; border: 1px solid var(--ink); box-shadow: 0 2px 6px rgba(17,24,39,.25); font-size: 16px; }
.btn-dark:hover { background: #1F2937; }
.btn-line { background: #FFFFFF; color: var(--ink); border: 1.5px solid #9CA3AF; }
.btn-line:hover { background: #F3F4F6; }

/* Menu contextuel (appui long : raccourci, jamais la seule voie) */
.ctx-scrim { position: fixed; inset: 0; z-index: 44; background: rgba(17,24,39,.08); }
.ctx {
  position: fixed; z-index: 45; min-width: 210px; padding: 6px; background: #FFFFFF; border-radius: 14px;
  box-shadow: 0 12px 32px rgba(17,24,39,.22), 0 0 0 1px rgba(17,24,39,.06);
}
.ctx-title { margin: 4px 10px 6px; font-size: 13px; color: var(--muted); font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx button {
  width: 100%; min-height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 10px;
  background: transparent; cursor: pointer; font-size: 15.5px; font-weight: 600; text-align: left; color: var(--ink);
}
.ctx button:hover, .ctx button:focus-visible { background: var(--surface); }
.ctx button svg { width: 19px; height: 19px; flex: none; }
.ctx button.danger { color: var(--danger); }

/* Feuille (etat du distributeur) */
.scrim { position: fixed; inset: 0; background: rgba(17,24,39,.4); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; margin: 0 auto; max-width: 480px;
  background: #FFFFFF; border-radius: 16px 16px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -8px 30px rgba(17,24,39,.15); animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.grab { width: 36px; height: 4px; border-radius: 4px; background: #D1D5DB; margin: 0 auto 12px; }
.sheet h3 { margin: 0 0 12px; font-size: 17px; }
.choices { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.choice {
  min-height: 52px; border: 1.5px solid #D1D5DB; border-radius: 12px; background: #FFFFFF; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 14px;
  box-shadow: 0 1px 2px rgba(17,24,39,.1);
}
.choice i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.choice[aria-current="true"] { border: 2px solid var(--ink); }
.sheet-close { width: 100%; margin-top: 10px; min-height: 44px; border: 0; background: transparent; font-weight: 600; cursor: pointer; color: var(--ink-2); }

/* Toast (avec « Annuler » quand l'action se rattrape) */
.toast {
  position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60;
  display: flex; align-items: center; gap: 4px; width: max-content; max-width: calc(100vw - 32px);
  background: var(--ink); color: #FFFFFF; padding: 4px 6px 4px 16px; min-height: 48px; border-radius: 12px;
  font-size: 14.5px; box-shadow: 0 6px 20px rgba(0,0,0,.22);
}
.toast-msg { padding: 8px 6px 8px 0; }
.toast-undo {
  min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
  color: #93C5FD; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap;
}
.toast-undo:hover { background: rgba(255,255,255,.08); }
.toast-undo:focus-visible { outline-color: #93C5FD; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

<div class="app">
  <!-- Outil de revue -->
  <section class="review" aria-label="Outil de revue">
    <button class="review-toggle" id="review-toggle" aria-expanded="false" aria-controls="review-body">
      <span>Réglages de la maquette</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="review-body" id="review-body" hidden>
      <fieldset>
        <legend>Mode</legend>
        <div class="opts">
          <label><input type="radio" name="mode" value="visitor"> Visiteur</label>
          <label><input type="radio" name="mode" value="member" checked> Connecté</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Fiche</legend>
        <div class="opts">
          <label><input type="radio" name="fiche" value="products" checked> Avec produits</label>
          <label><input type="radio" name="fiche" value="empty"> Sans produit</label>
        </div>

      <button class="review-reset" id="reset">Réinitialiser la démo</button>
    </div>
  </section>

  <div class="top">
    <div class="topbar">
      <button class="icon-btn" id="fav" aria-pressed="false" aria-label="Ajouter aux favoris">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path class="heart" d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      </button>
      <button class="icon-btn" id="share" aria-label="Partager">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      </button>
      <button class="icon-btn" id="close" aria-label="Fermer la fiche">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <header class="head">
      <div class="title-row">
        <h1 class="title" id="name"></h1>
        <span class="tag-demo" id="demo">Démo</span>
      </div>
      <div class="status-row" id="status-row"></div>
      <p class="meta" id="meta"></p>
    </header>
    <nav class="tabs" aria-label="Sections de la fiche">
      <div class="tabs-track" role="tablist">
        <button class="tab" role="tab" id="tab-products" aria-controls="panel-products" aria-selected="true">Produits</button>
        <button class="tab" role="tab" id="tab-reviews" aria-controls="panel-reviews" aria-selected="false" tabindex="-1">Avis</button>
        <button class="tab" role="tab" id="tab-about" aria-controls="panel-about" aria-selected="false" tabindex="-1">À propos</button>
      </div>
    </nav>
  </div>

  <main class="content">
    <section id="panel-products" role="tabpanel" aria-labelledby="tab-products">
      <div class="shelf-head">
        <h2 id="shelf-t">Il reste quoi ?</h2>
        <span class="count" id="count"></span>
      </div>
      <p class="notice" id="notice" hidden></p>
      <div class="empty" id="empty" hidden></div>
      <ul class="list" id="list" aria-labelledby="shelf-t"></ul>
      <label class="add-row" id="add-row">
        <span class="add-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        <span class="sr-only">Ajouter un produit</span>
        <input class="add-input" id="add-input" type="text" placeholder="Ajouter un produit…" enterkeyhint="enter" autocomplete="off" autocapitalize="sentences" maxlength="60">
      </label>
      <div class="invite" id="invite" role="region" aria-labelledby="invite-t">
        <span class="invite-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        </span>
        <div class="invite-text">
          <h3 id="invite-t">Tu es devant le distributeur ?</h3>
          <p>Connecte-toi pour signaler ce qu'il reste, donner ton avis et ajouter des photos.</p>
        </div>
        <div class="invite-preview" aria-hidden="true">
          <span class="invite-chip"><span class="feu all"><i></i><i></i><i></i></span>État</span>
          <span class="invite-chip">Dispo / Pas dispo</span>
          <span class="invite-chip">Avis</span>
          <span class="invite-chip">Photos</span>
        </div>
        <button class="btn-brand" id="login">Se connecter</button>
      </div>
    </section>

    <section id="panel-reviews" role="tabpanel" aria-labelledby="tab-reviews" hidden>
      <div class="panel-card" id="reviews"></div>
    </section>

    <section id="panel-about" role="tabpanel" aria-labelledby="tab-about" hidden>
      <div class="panel-card about">
        <div class="about-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <span id="address"></span>
        </div>
        <div class="about-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h18M13 6l6 6-6 6"/></svg>
          <span id="distance"></span>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="dock">
  <div class="dock-in">
    <button class="btn btn-line" id="photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Photo
    </button>
    <button class="btn btn-dark" id="route">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 3 21l9-5 9 5z"/></svg>
      Itinéraire
    </button>
  </div>
</div>

<div class="ctx-scrim" id="ctx-scrim" hidden></div>
<div class="ctx" id="ctx" role="menu" aria-labelledby="ctx-title" hidden></div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grab" aria-hidden="true"></div>
  <h3 id="sheet-title">Le distributeur, là maintenant ?</h3>
  <div class="choices" id="sheet-choices"></div>
  <button class="sheet-close" id="sheet-close">Fermer</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span class="toast-msg" id="toast-msg"></span>
  <button class="toast-undo" id="toast-undo" hidden>Annuler</button>
</div>

<script>
(function () {
  'use strict';
  var SOFT_AFTER = 120;      // minutes : au-dela, un Dispo est adouci
  var MOVE_TOLERANCE = 10;   // px : au-dela, c'est un defilement ou un glissement, pas un tap
  var LONG_PRESS_MS = 520;
  var RESORT_DELAY = 1100;   // la ligne ne fuit pas sous le doigt : le tri attend un peu
  var UNDO_MS = 7000;

  var ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M7 12h10"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>'
  };
  // Pictos au trait (repris de la fiche v3)
  var ART = {
    basket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16l-1.6 8.4A2 2 0 0 1 16.4 20H7.6a2 2 0 0 1-2-1.6z"/><path d="M8.5 10 12 4.5 15.5 10M9.5 14v2.5M14.5 14v2.5"/></svg>',
    potato: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 5.5c3.2-2.1 8.8-1.2 10.7 2.6 1.9 3.9.6 8.8-3.4 10.4-4.1 1.7-9.7.7-10.9-3.8C3 11.4 4.6 7.4 7.5 5.5z"/><path d="M9.5 10h.01M14 13.5h.01M11.5 15.5h.01"/></svg>',
    carrot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 8.5c1.4 1.4 1.3 3-.1 4.4L6.2 20.1c-.9.6-2-.4-1.4-1.3L12 9.6c1.4-1.4 2.9-1.5 3.5-1.1z"/><path d="M15.5 8.5 19 5M15.5 8.5 16 3.5M15.5 8.5l5 .5M9 13.5l1.5 1.5M11.5 11l1 1"/></svg>',
    salad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20c-4.8 0-8-2.8-8-6.6 0-1.8.9-3 2-3.8.2-3 2.8-5.1 6-5.1s5.8 2.1 6 5.1c1.1.8 2 2 2 3.8 0 3.8-3.2 6.6-8 6.6z"/><path d="M12 20v-9M12 15l-3-3M12 17l3-3"/></svg>',
    egg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.6 0 6.5 5.4 6.5 10a6.5 6.5 0 0 1-13 0C5.5 8.4 8.4 3 12 3z"/></svg>',
    apple: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.5c-1.5-1-5.5-1.3-6.8 2.2-1.3 3.6.9 9.3 3.8 9.8 1.2.2 1.9-.5 3-.5s1.8.7 3 .5c2.9-.5 5.1-6.2 3.8-9.8C17.5 6.2 13.5 6.5 12 7.5z"/><path d="M12 7.5c0-2 .8-3.5 2.5-4"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8 12 4l8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>'
  };

  var FICHES = {
    products: {
      name: 'Légumes Bio Cambo', demo: true, type: 'Produits agricoles', price: '€€', rating: '4,7', reviews: 91,
      address: 'Route des Thermes, 64250 Cambo-les-Bains', distance: '2,3 km',
      machine: { state: 'working', age: 12 },
      products: [
        { id: 'p1', name: 'Panier légumes saison', art: 'basket' },
        { id: 'p2', name: 'Pommes de terre (2 kg)', art: 'potato' },
        { id: 'p3', name: 'Carottes (1 kg)', art: 'carrot' },
        { id: 'p4', name: 'Salades (lot de 2)', art: 'salad' }
      ],
      signals: { p1: { status: 'in', age: 12 }, p2: { status: 'in', age: 180 }, p3: { status: 'out', age: 40 }, p4: null }
    },
    empty: {
      name: 'Gaztainbidea', demo: false, type: 'Terroir local', price: '€', rating: null, reviews: 0,
      address: 'Impasse Gaztainbidea, Bayonne', distance: '450 m',
      machine: { state: 'broken', age: 120 },
      products: [], signals: {}
    }
  };
  var STATE_WORD = { working: 'En service', empty: 'Vide', broken: 'En panne', none: "Pas d'info" };
  var STATUS_WORD = { in: 'Dispo', out: 'Pas dispo', none: "Pas d'info" };
  var ORDER = { in: 0, none: 1, out: 2 };

  var state = { mode: 'member', fiche: 'products', fav: false, hint: true, seq: 0,
    products: [], signals: {}, order: [], machine: null, price: '€€', pricePicking: false, editing: null };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function isMember() { return state.mode === 'member'; }
  function reducedMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) { /* pas de vibreur */ } }
  function findProduct(id) { return state.products.filter(function (p) { return p.id === id; })[0]; }

  function formatAge(min) {
    if (min < 1) return "à l'instant";
    if (min < 60) return 'il y a ' + min + ' min';
    if (min < 1440) return 'il y a ' + Math.floor(min / 60) + ' h';
    return 'il y a ' + Math.floor(min / 1440) + ' j';
  }

  function loadFiche() {
    var f = FICHES[state.fiche];
    state.products = clone(f.products);
    state.signals = clone(f.signals);
    state.machine = clone(f.machine);
    state.price = f.price;
    state.hint = true;
    state.editing = null;
    state.pricePicking = false;
    state.order = sortedIds();
  }

  // Un distributeur vide / en panne plus recent que le signal d'un produit le passe en Pas dispo
  function resolve(p) {
    var sig = state.signals[p.id];
    var m = state.machine;
    var down = m.state === 'empty' || m.state === 'broken';
    if (down && (!sig || sig.age > m.age)) return { status: 'out', age: m.age };
    if (!sig || sig.age >= 1440) return { status: 'none', age: null };
    return { status: sig.status, age: sig.age };
  }

  function sortedIds() {
    return state.products
      .map(function (p, i) { return { id: p.id, s: ORDER[resolve(p).status], i: i }; })
      .sort(function (a, b) { return (a.s - b.s) || (a.i - b.i); })
      .map(function (x) { return x.id; });
  }

  function snapshot() {
    return clone({ products: state.products, signals: state.signals, order: state.order, machine: state.machine, price: state.price });
  }
  function restore(s) {
    state.products = s.products; state.signals = s.signals; state.order = s.order; state.machine = s.machine; state.price = s.price;
  }

  // ---------- Rendu ----------
  function renderStatus() {
    var m = state.machine;
    var when = formatAge(m.age);
    var row = $('status-row');
    row.dataset.state = m.state;
    row.innerHTML = '<span class="feu" aria-hidden="true"><i></i><i></i><i></i></span>'
      + '<span><span class="status-word">' + STATE_WORD[m.state] + '</span> · ' + esc(when) + '</span>'
      + (isMember() ? '<button class="update-pill" id="machine-btn" aria-haspopup="dialog">' + ICON.refresh + 'Mettre à jour</button>' : '');
  }

  function renderMeta() {
    var f = FICHES[state.fiche];
    var price;
    if (state.pricePicking) {
      price = '<span class="price-pick" role="radiogroup" aria-label="Niveau de prix">'
        + ['€', '€€', '€€€'].map(function (v) {
          var on = v === state.price;
          return '<button role="radio" data-price="' + v + '" aria-checked="' + on + '" tabindex="' + (on ? 0 : -1) + '">' + v + '</button>';
        }).join('') + '</span>';
    } else if (isMember()) {
      price = '<button class="price-btn" id="price-btn" aria-label="Niveau de prix : ' + state.price + '. Changer">' + state.price + '</button>';
    } else {
      price = '<span class="price" data-visitor-edit="1">' + state.price + '</span>';
    }
    var rating = f.rating ? '<span><span class="star" aria-hidden="true">★</span> ' + f.rating + ' (' + f.reviews + ')</span>' : '<span>Pas encore d\'avis</span>';
    $('meta').innerHTML = '<span>' + esc(f.type) + '</span><span aria-hidden="true">·</span>' + price + '<span aria-hidden="true">·</span>' + rating;
  }

  function itemHTML(p, first) {
    var r = resolve(p);
    var member = isMember();
    var soft = r.status === 'in' && r.age !== null && r.age >= SOFT_AFTER;
    var cls = 'row is-' + r.status + (soft ? ' is-soft' : '') + (member ? '' : ' visitor');
    var when = r.status === 'none' ? 'aucun signal depuis 24 h' : (r.status === 'in' ? 'vu ' : '') + formatAge(r.age);
    var sub = '<span class="sub" id="sub-' + p.id + '"><b>' + STATUS_WORD[r.status] + '</b> · ' + esc(when) + '</span>';
    var ringIcon = r.status === 'in' ? ICON.check : r.status === 'out' ? ICON.dash : '';
    var name, check;
    if (state.editing === p.id) {
      name = '<input class="name-input" id="name-input" data-focus="edit:' + p.id + '" value="' + esc(p.name) + '" maxlength="60" enterkeyhint="done" aria-label="Nom du produit (vide pour le retirer)">';
    } else if (member) {
      name = '<button class="name" data-name="' + p.id + '" data-focus="name:' + p.id + '" aria-label="' + esc(p.name) + ', renommer">' + esc(p.name) + '</button>';
    } else {
      name = '<span class="name">' + esc(p.name) + '</span>';
    }
    if (member) {
      var action = r.status === 'in' ? 'Décocher : Pas dispo' : 'Cocher : Dispo';
      check = '<button class="check" role="checkbox" aria-checked="' + (r.status === 'in') + '" data-check="' + p.id + '" data-focus="check:' + p.id + '"'
        + ' aria-label="' + esc(p.name) + '" aria-describedby="sub-' + p.id + ' act-' + p.id + '">'
        + '<span class="ring">' + ringIcon + '</span><span class="sr-only" id="act-' + p.id + '">' + action + '. Suppr pour retirer.</span></button>';
    } else {
      check = '<span class="check" aria-hidden="true"><span class="ring">' + ringIcon + '</span></span>';
    }
    var hint = first && member && state.hint
      ? '<span class="hint">' + ICON.info + '<span>Touche le rond pour dire si c\'est dispo, le nom pour le renommer</span></span>' : '';
    return '<li class="item" data-id="' + p.id + '">'
      + (member ? '<button class="item-del" data-del="' + p.id + '" tabindex="-1" aria-hidden="true">' + ICON.trash + 'Retirer</button>' : '')
      + '<div class="' + cls + '" data-row="' + p.id + '">'
      + '<span class="art" aria-hidden="true">' + ART[p.art] + '</span>'
      + '<span class="txt">' + name + sub + '</span>' + check + hint
      + '</div></li>';
  }

  function focusKey() {
    var a = document.activeElement;
    return a && a.dataset ? a.dataset.focus || null : null;
  }
  function restoreFocus(key) {
    if (!key) return;
    var el = document.querySelector('[data-focus="' + key + '"]');
    if (el) el.focus({ preventScroll: true });
  }

  function renderList() {
    var key = focusKey();
    var member = isMember();
    var hasProducts = state.products.length > 0;
    var list = $('list');
    list.innerHTML = state.order.map(function (id, i) { return itemHTML(findProduct(id), i === 0); }).join('');
    list.hidden = !hasProducts;
    openId = null;

    var dispo = state.products.filter(function (p) { return resolve(p).status === 'in'; }).length;
    $('count').textContent = hasProducts ? '· ' + dispo + ' sur ' + state.products.length + ' dispo' : '';

    var empty = $('empty');
    empty.hidden = hasProducts;
    empty.className = 'empty' + (member ? ' member' : '');
    empty.innerHTML = member
      ? '<strong>Aucun produit pour l\'instant</strong><span>Tu es devant ? Écris ce que tu vois, un produit à la fois.</span>'
      : '<strong>Aucun produit référencé</strong><span>Personne n\'a encore dit ce que vend ce distributeur.</span>';
    $('add-row').hidden = !member;
    $('add-row').classList.toggle('lone', !hasProducts);

    var m = state.machine;
    var notice = $('notice');
    if (m.state === 'empty' || m.state === 'broken') {
      notice.hidden = false;
      notice.className = 'notice' + (m.state === 'broken' ? ' broken' : '');
      notice.innerHTML = '<b>Distributeur signalé ' + (m.state === 'empty' ? 'vide' : 'en panne') + '</b> ' + esc(formatAge(m.age))
        + (hasProducts ? ' : les produits sont probablement épuisés.' : '.');
    } else {
      notice.hidden = true;
    }
    restoreFocus(key);
    var inp = $('name-input');
    if (inp && key !== 'edit:' + state.editing) { inp.focus(); inp.select(); }
  }

  function renderReviews() {
    var f = FICHES[state.fiche];
    if (!f.rating) {
      $('reviews').innerHTML = '<p style="margin:0;color:var(--muted)">Pas encore d\'avis sur ce distributeur.</p>';
      return;
    }
    $('reviews').innerHTML = '<div class="rating"><span class="big">' + f.rating + '</span><div><div class="stars" aria-label="4,7 sur 5">★★★★★</div><div style="font-size:13px;color:var(--muted)">' + f.reviews + ' avis</div></div></div>'
      + '<div class="review-item"><b>Membre DistriMatch</b> · <span class="stars" aria-label="5 sur 5">★★★★★</span><br>Légumes très frais, le panier change chaque semaine. Paiement CB sans souci.</div>';
  }

  function render() {
    var f = FICHES[state.fiche];
    $('name').textContent = f.name;
    $('demo').hidden = !f.demo;
    renderStatus();
    renderMeta();
    renderList();
    renderReviews();
    $('address').textContent = f.address;
    $('distance').textContent = 'À ' + f.distance + ' de toi';
    $('invite').hidden = isMember();
    $('photo').hidden = !isMember();
  }

  // Tri differe, avec animation FLIP : la ligne cochee rejoint son groupe sans sauter
  var resortTimer = null;
  function scheduleResort() {
    clearTimeout(resortTimer);
    resortTimer = setTimeout(resort, RESORT_DELAY);
  }
  function resort() {
    if (state.editing || openId || drag) { scheduleResort(); return; }
    var next = sortedIds();
    if (next.join() === state.order.join()) return;
    var before = {};
    document.querySelectorAll('#list .item').forEach(function (li) { before[li.dataset.id] = li.getBoundingClientRect().top; });
    state.order = next;
    renderList();
    if (reducedMotion()) return;
    document.querySelectorAll('#list .item').forEach(function (li) {
      var dy = (before[li.dataset.id] || 0) - li.getBoundingClientRect().top;
      if (!dy) return;
      li.style.transform = 'translateY(' + dy + 'px)';
      li.getBoundingClientRect();
      li.style.transition = 'transform .28s ease';
      li.style.transform = '';
      setTimeout(function () { li.style.transition = ''; }, 320);
    });
  }

  function flash(id, pop) {
    var row = document.querySelector('[data-row="' + id + '"]');
    if (!row) return;
    row.classList.add('flash');
    if (pop) row.classList.add('pop');
  }

  function doneHint() { state.hint = false; }

  // ---------- Toast ----------
  var toastTimer = null, undoSnap = null, undoFocus = null;
  function toast(msg, snap, focusAfterUndo) {
    var t = $('toast');
    $('toast-msg').textContent = msg;
    undoSnap = snap || null;
    undoFocus = focusAfterUndo || null;
    $('toast-undo').hidden = !snap;
    t.hidden = false;
    armToast();
  }
  function hideToast() { clearTimeout(toastTimer); $('toast').hidden = true; undoSnap = null; }
  function armToast() {
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      var t = $('toast');
      if (t.contains(document.activeElement) || t.matches(':hover')) { armToast(); return; }
      t.hidden = true; undoSnap = null;
    }, undoSnap ? UNDO_MS : 2600);
  }
  $('toast-undo').addEventListener('click', function () {
    if (!undoSnap) return;
    restore(undoSnap);
    undoSnap = null;
    state.editing = null;
    render();
    var key = undoFocus;
    var el = key && document.querySelector('[data-focus="' + key + '"]');
    toast('Annulé');
    if (el) { el.focus({ preventScroll: true }); flash(key.split(':')[1]); } else { $('add-input').focus({ preventScroll: true }); }
  });

  // ---------- Actions ----------
  function toggle(id) {
    var p = findProduct(id);
    if (!p) return;
    var snap = snapshot();
    var next = resolve(p).status === 'in' ? 'out' : 'in';
    state.signals[id] = { status: next, age: 0 };
    doneHint(); buzz();
    renderList(); renderStatus();
    flash(id, true);
    scheduleResort();
    toast('Merci ! Ton signal aide les suivants', snap, 'check:' + id);
  }

  function removeItem(id) {
    var p = findProduct(id);
    if (!p) return;
    var snap = snapshot();
    var idx = state.order.indexOf(id);
    state.products = state.products.filter(function (x) { return x.id !== id; });
    state.order = state.order.filter(function (x) { return x !== id; });
    state.editing = null;
    doneHint(); buzz();
    renderList();
    var nextId = state.order[Math.min(idx, state.order.length - 1)];
    var el = nextId && document.querySelector('[data-focus="check:' + nextId + '"]');
    if (el) el.focus({ preventScroll: true }); else $('add-input').focus({ preventScroll: true });
    toast(p.name + ' retiré', snap, 'check:' + id);
  }

  function guessArt(name) {
    var n = name.toLowerCase();
    if (/pomme de terre|patate/.test(n)) return 'potato';
    if (/carott/.test(n)) return 'carrot';
    if (/salade|laitue|épinard|chou/.test(n)) return 'salad';
    if (/œuf|oeuf/.test(n)) return 'egg';
    if (/pomme|poire|fruit/.test(n)) return 'apple';
    if (/panier|légume/.test(n)) return 'basket';
    return 'box';
  }

  function addProduct(raw) {
    var name = raw.trim().replace(/\s+/g, ' ');
    if (!name) return false;
    var dup = state.products.filter(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })[0];
    if (dup) { toast(dup.name + ' est déjà dans la liste'); flash(dup.id); return true; }
    var snap = snapshot();
    var id = 'n' + (++state.seq);
    state.products.push({ id: id, name: name, art: guessArt(name) });
    state.order = sortedIds();
    doneHint(); buzz();
    renderList();
    flash(id);
    toast(name + ' ajouté', snap, null);
    return true;
  }

  function startRename(id) {
    state.editing = id;
    closeSwipe();
    renderList();
    var inp = $('name-input');
    if (inp) { inp.focus(); inp.select(); }
  }
  var committing = false;
  function commitRename(cancel, fromBlur) {
    if (committing || !state.editing) return;
    committing = true;
    var id = state.editing;
    var p = findProduct(id);
    var inp = $('name-input');
    var val = inp ? inp.value.trim().replace(/\s+/g, ' ') : '';
    // Perte du focus vers un autre element : on ne lui vole pas le focus
    var keepFocus = !fromBlur || document.activeElement === document.body || document.activeElement === inp;
    state.editing = null;
    if (cancel || !p || val === p.name) {
      renderList();
      if (keepFocus) restoreFocus('name:' + id);
    } else if (!val) {
      removeItem(id);
    } else {
      var snap = snapshot();
      p.name = val;
      doneHint();
      renderList();
      if (keepFocus) restoreFocus('name:' + id);
      flash(id);
      toast('Nom mis à jour', snap, 'name:' + id);
    }
    committing = false;
  }

  function setPrice(v) {
    var snap = snapshot();
    var changed = v !== state.price;
    state.price = v;
    state.pricePicking = false;
    renderMeta();
    $('price-btn').focus({ preventScroll: true });
    if (changed) { doneHint(); buzz(); toast('Merci ! Prix mis à jour', snap, null); }
  }
  function closePrice(focusBtn) {
    if (!state.pricePicking) return;
    state.pricePicking = false;
    renderMeta();
    if (focusBtn) $('price-btn').focus({ preventScroll: true });
  }

  function nudgeInvite() {
    var inv = $('invite');
    inv.classList.remove('nudge');
    void inv.offsetWidth;
    inv.classList.add('nudge');
    inv.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
    $('login').focus({ preventScroll: true });
  }

  // ---------- Menu contextuel (appui long / clic droit / touche Menu) ----------
  var ctxFor = null;
  function openCtx(id) {
    var p = findProduct(id);
    var row = document.querySelector('[data-row="' + id + '"]');
    if (!p || !row) return;
    ctxFor = id;
    closeSwipe();
    var r = resolve(p);
    var soft = r.status === 'in' && r.age >= SOFT_AFTER;
    var ctx = $('ctx');
    ctx.innerHTML = '<p class="ctx-title" id="ctx-title">' + esc(p.name) + '</p>'
      + (soft ? '<button role="menuitem" data-ctx="confirm">' + ICON.check + 'Toujours dispo</button>' : '')
      + '<button role="menuitem" data-ctx="rename">' + ICON.pen + 'Renommer</button>'
      + '<button role="menuitem" class="danger" data-ctx="remove">' + ICON.trash + 'Retirer</button>';
    ctx.hidden = false; $('ctx-scrim').hidden = false;
    var rect = row.getBoundingClientRect();
    var h = ctx.offsetHeight, w = ctx.offsetWidth;
    var top = rect.bottom + 6;
    if (top + h > window.innerHeight - 90) top = Math.max(8, rect.top - h - 6);
    ctx.style.top = top + 'px';
    ctx.style.left = Math.max(16, Math.min(rect.right - w, window.innerWidth - w - 16)) + 'px';
    ctx.querySelector('button').focus({ preventScroll: true });
  }
  function closeCtx(refocus) {
    if ($('ctx').hidden) return;
    $('ctx').hidden = true; $('ctx-scrim').hidden = true;
    var id = ctxFor; ctxFor = null;
    if (refocus && id) restoreFocus('check:' + id);
  }
  $('ctx').addEventListener('click', function (e) {
    var b = e.target.closest('[data-ctx]');
    if (!b) return;
    var id = ctxFor, act = b.dataset.ctx;
    closeCtx(false);
    if (act === 'rename') startRename(id);
    if (act === 'remove') removeItem(id);
    if (act === 'confirm') {
      var snap = snapshot();
      state.signals[id] = { status: 'in', age: 0 };
      doneHint(); buzz(); renderList(); flash(id, true); restoreFocus('check:' + id);
      toast('Merci ! Ton signal aide les suivants', snap, 'check:' + id);
    }
  });
  $('ctx').addEventListener('keydown', function (e) {
    var items = Array.prototype.slice.call($('ctx').querySelectorAll('button'));
    var i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); closeCtx(true); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Tab') { e.preventDefault(); items[(i + (e.shiftKey ? -1 : 1) + items.length) % items.length].focus(); }
  });
  $('ctx-scrim').addEventListener('pointerdown', function (e) { e.preventDefault(); closeCtx(true); });

  // ---------- Glisser pour retirer (le seul swipe) ----------
  var drag = null, openId = null, suppressUntil = 0;
  function delWidth() { return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--del-w'), 10) || 104; }
  function setOpen(id) {
    closeSwipe();
    var row = document.querySelector('[data-row="' + id + '"]');
    var del = document.querySelector('[data-del="' + id + '"]');
    if (!row || !del) return;
    openId = id;
    row.parentNode.classList.add('show-del');
    row.style.transform = 'translateX(' + (-delWidth()) + 'px)';
    del.tabIndex = 0; del.removeAttribute('aria-hidden');
  }
  function hideDelLater(row) {
    setTimeout(function () { if (row.style.transform === '' && row.parentNode) row.parentNode.classList.remove('show-del'); }, 260);
  }
  function closeSwipe() {
    if (!openId) return;
    var row = document.querySelector('[data-row="' + openId + '"]');
    var del = document.querySelector('[data-del="' + openId + '"]');
    if (row) { row.style.transform = ''; hideDelLater(row); }
    if (del) { del.tabIndex = -1; del.setAttribute('aria-hidden', 'true'); del.classList.remove('full'); }
    openId = null;
  }

  var list = $('list');
  list.addEventListener('pointerdown', function (e) {
    var row = e.target.closest('.row');
    if (!row || e.target.closest('input') || (e.button && e.button !== 0) || !isMember()) return;
    var id = row.dataset.row;
    drag = { id: id, row: row, x0: e.clientX, y0: e.clientY, mode: null, pid: e.pointerId, base: openId === id ? -delWidth() : 0, x: 0 };
    drag.lp = setTimeout(function () {
      if (!drag || drag.mode) return;
      drag.mode = 'long';
      suppressUntil = Date.now() + 800;
      buzz();
      openCtx(id);
    }, LONG_PRESS_MS);
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.pid) return;
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.mode) {
      if (Math.abs(dx) <= MOVE_TOLERANCE && Math.abs(dy) <= MOVE_TOLERANCE) return;
      clearTimeout(drag.lp);
      if (Math.abs(dx) > Math.abs(dy)) {
        drag.mode = 'swipe';
        if (openId && openId !== drag.id) closeSwipe();
        drag.row.classList.add('dragging');
        drag.row.parentNode.classList.add('show-del');
        try { drag.row.setPointerCapture(drag.pid); } catch (err) { /* ignore */ }
      } else {
        drag.mode = 'scroll';
      }
    }
    if (drag.mode !== 'swipe') return;
    var w = drag.row.offsetWidth;
    var x = Math.max(-w, Math.min(0, drag.base + dx));
    drag.x = x;
    drag.row.style.transform = 'translateX(' + x + 'px)';
    var del = document.querySelector('[data-del="' + drag.id + '"]');
    if (del) del.classList.toggle('full', x < -w * 0.55);
  });
  function endDrag(e, cancelled) {
    if (!drag || (e && e.pointerId !== drag.pid)) return;
    clearTimeout(drag.lp);
    var d = drag;
    drag = null;
    if (d.mode) suppressUntil = Date.now() + 400;
    if (d.mode !== 'swipe') return;
    d.row.classList.remove('dragging');
    var w = d.row.offsetWidth;
    if (!cancelled && d.x < -w * 0.55) { removeItem(d.id); return; }
    if (!cancelled && d.x < -48) { setOpen(d.id); return; }
    d.row.style.transform = '';
    hideDelLater(d.row);
    if (openId === d.id) closeSwipe();
  }
  document.addEventListener('pointerup', function (e) { endDrag(e, false); });
  document.addEventListener('pointercancel', function (e) { endDrag(e, true); });
  // Un geste qui a bouge n'est pas un tap
  document.addEventListener('click', function (e) {
    if (Date.now() < suppressUntil && e.target.closest('#list')) { e.stopPropagation(); e.preventDefault(); }
  }, true);
  list.addEventListener('contextmenu', function (e) {
    var row = e.target.closest('.row');
    if (!row || e.target.closest('input')) return;
    e.preventDefault();
    if (isMember() && e.pointerType !== 'touch' && !(drag && drag.mode)) openCtx(row.dataset.row);
  });

  // Taps : le rond ou la ligne = Dispo / Pas dispo ; le nom = renommer
  list.addEventListener('click', function (e) {
    var del = e.target.closest('[data-del]');
    if (del) { removeItem(del.dataset.del); return; }
    var row = e.target.closest('.row');
    if (!row || e.target.closest('input')) return;
    var id = row.dataset.row;
    if (!isMember()) { nudgeInvite(); return; }
    if (openId) { closeSwipe(); return; }
    if (e.target.closest('[data-name]')) { startRename(id); return; }
    toggle(id);
  });
  list.addEventListener('keydown', function (e) {
    if (e.target.id === 'name-input') {
      if (e.key === 'Enter') { e.preventDefault(); commitRename(false); }
      else if (e.key === 'Escape') { e.preventDefault(); commitRename(true); }
      return;
    }
    var chk = e.target.closest('[data-check], [data-name]');
    if (!chk) return;
    var id = chk.dataset.check || chk.dataset.name;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeItem(id); }
    else if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) { e.preventDefault(); openCtx(id); }
  });
  list.addEventListener('focusout', function (e) {
    if (e.target.id === 'name-input') setTimeout(function () { commitRename(false, true); }, 0);
  });

  // Ajouter : Entree ajoute et garde le curseur pour enchainer ; perte du focus avec texte = ajoute
  var addInput = $('add-input');
  addInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (addProduct(addInput.value)) addInput.value = '';
    } else if (e.key === 'Escape') {
      addInput.value = ''; addInput.blur();
    }
  });
  addInput.addEventListener('blur', function () {
    if (addInput.value.trim() && addProduct(addInput.value)) addInput.value = '';
  });
  addInput.addEventListener('focus', closeSwipe);

  // Prix : toucher « €€ » ouvre € / €€ / €€€ en place
  $('meta').addEventListener('click', function (e) {
    if (e.target.closest('#price-btn')) {
      state.pricePicking = true; renderMeta();
      var cur = $('meta').querySelector('[aria-checked="true"]'); if (cur) cur.focus({ preventScroll: true });
      return;
    }
    var pb = e.target.closest('[data-price]');
    if (pb) { setPrice(pb.dataset.price); return; }
    if (e.target.closest('[data-visitor-edit]')) nudgeInvite();
  });
  $('meta').addEventListener('keydown', function (e) {
    if (!state.pricePicking) return;
    var opts = Array.prototype.slice.call($('meta').querySelectorAll('[data-price]'));
    var i = opts.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); closePrice(true); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      var n = opts[(i + (e.key === 'ArrowRight' ? 1 : -1) + opts.length) % opts.length];
      opts.forEach(function (o) { o.tabIndex = -1; }); n.tabIndex = 0; n.focus();
    }
  });
  document.addEventListener('pointerdown', function (e) {
    if (state.pricePicking && !e.target.closest('.price-pick')) closePrice(false);
    if (openId && !e.target.closest('.item[data-id="' + openId + '"]')) closeSwipe();
  });

  // ---------- Etat du distributeur (feuille existante) ----------
  var lastFocus = null;
  function openSheet() {
    lastFocus = document.activeElement;
    var cur = state.machine.state;
    var dots = { working: 'var(--ok)', empty: 'var(--warn)', broken: 'var(--ko)' };
    $('sheet-choices').innerHTML = ['working', 'empty', 'broken'].map(function (s) {
      return '<button class="choice" data-msig="' + s + '"' + (cur === s ? ' aria-current="true"' : '') + '><i style="background:' + dots[s] + '"></i>' + STATE_WORD[s] + '</button>';
    }).join('');
    $('scrim').hidden = false; $('sheet').hidden = false;
    $('sheet-choices').querySelector('button').focus();
  }
  function closeSheet() {
    $('scrim').hidden = true; $('sheet').hidden = true;
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }
  $('status-row').addEventListener('click', function (e) { if (e.target.closest('#machine-btn')) openSheet(); });
  $('sheet-choices').addEventListener('click', function (e) {
    var b = e.target.closest('[data-msig]');
    if (!b) return;
    var snap = snapshot();
    state.machine = { state: b.dataset.msig, age: 0 };
    closeSheet();
    buzz(); renderStatus(); renderList(); scheduleResort();
    $('machine-btn').focus();
    toast('Merci ! Ton signal aide les suivants', snap, null);
  });
  $('scrim').addEventListener('click', closeSheet);
  $('sheet-close').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if ($('sheet').hidden) return;
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.key !== 'Tab') return;
    var f = $('sheet').querySelectorAll('button');
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // ---------- Onglets ----------
  var TABS = ['products', 'reviews', 'about'];
  function selectTab(name, focus) {
    TABS.forEach(function (t) {
      var on = t === name;
      var tab = $('tab-' + t);
      tab.setAttribute('aria-selected', String(on));
      tab.tabIndex = on ? 0 : -1;
      $('panel-' + t).hidden = !on;
      if (on && focus) tab.focus();
    });
  }
  document.querySelector('.tabs-track').addEventListener('click', function (e) {
    var t = e.target.closest('[role="tab"]');
    if (t) selectTab(t.id.replace('tab-', ''), false);
  });
  document.querySelector('.tabs-track').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var i = TABS.indexOf(document.activeElement.id.replace('tab-', ''));
    selectTab(TABS[(i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length], true);
  });

  // ---------- Reglages de la maquette ----------
  $('review-toggle').addEventListener('click', function () {
    var open = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', String(!open));
    $('review-body').hidden = open;
  });
  document.querySelectorAll('.review input').forEach(function (inp) {
    inp.addEventListener('change', function () {
      hideToast();
      if (inp.name === 'mode') { state.mode = inp.value; state.editing = null; state.pricePicking = false; }
      if (inp.name === 'fiche') { state.fiche = inp.value; loadFiche(); }
      render();
    });
  });
  $('reset').addEventListener('click', function () {
    hideToast(); loadFiche(); selectTab('products', false); render(); toast('Démo réinitialisée');
  });

  // ---------- Divers ----------
  $('login').addEventListener('click', function () {
    document.querySelector('input[name="mode"][value="member"]').checked = true;
    state.mode = 'member';
    render();
    toast('Connecté (maquette)');
    var first = document.querySelector('[data-check]');
    if (first) first.focus({ preventScroll: true }); else addInput.focus();
  });
  $('fav').addEventListener('click', function () {
    state.fav = !state.fav;
    this.setAttribute('aria-pressed', String(state.fav));
    this.setAttribute('aria-label', state.fav ? 'Retirer des favoris' : 'Ajouter aux favoris');
    toast(state.fav ? 'Ajouté à tes favoris' : 'Retiré de tes favoris');
  });
  $('share').addEventListener('click', function () { toast('Lien copié'); });
  $('close').addEventListener('click', function () { toast('Maquette : retour à la carte'); });
  $('route').addEventListener('click', function () { toast('Maquette : ouverture de l\'itinéraire'); });
  $('photo').addEventListener('click', function () { toast('Maquette : ajouter une photo'); });

  loadFiche();
  render();
})();
</script>
